spring.application.name=lostfound
# Server Configuration
server.port=8080
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}
spring.config.import=optional:file:./application-local.properties

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/lost_found_db2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
